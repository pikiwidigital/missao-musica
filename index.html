<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Missão: Música! — companheiro digital do jogo musical Pikiwi."
  >

  <meta name="theme-color" content="#fff7e8">

  <title>Missão: Música!</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.webmanifest">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Missão Música"
  >
</head>

<body>

  <main class="home-screen">

    <section class="home-content">

      <img
        class="brand-logo"
        src="logo.png"
        alt="Missão: Música!, com Pikiwi"
      >

      <p class="welcome-message">
        Vamos jogar juntos?
      </p>

      <button
        class="start-button"
        id="start-button"
        type="button"
      >
        Começar
      </button>

      <p
        class="status-message"
        id="status-message"
        aria-live="polite"
      ></p>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
